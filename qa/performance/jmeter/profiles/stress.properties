# STRESS: push concurrency beyond the application's connection pool (maximum 10 connections in
# application-dev.properties) to see how it behaves when database access queues up.
# Illustrative numbers only. Run it only against a database you can afford to fill and clean up.
host=localhost
port=8080
readThreads=30
writeThreads=10
negativeThreads=2
rampUp=30
loops=-1
duration=180
thinkBaseMs=100
thinkRangeMs=100
# PLACEHOLDER threshold, not a requirement: no SLA exists for this application.
maxResponseMs=2000
