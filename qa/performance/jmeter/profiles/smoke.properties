# SMOKE: one user per workload, one iteration. Purpose: prove the plan, the target and the assertions work
# before any load is applied. Not a performance measurement.
host=localhost
port=8080
readThreads=1
writeThreads=1
negativeThreads=1
rampUp=1
loops=1
duration=60
thinkBaseMs=0
thinkRangeMs=0
# PLACEHOLDER threshold, not a requirement: no SLA exists for this application.
maxResponseMs=2000
