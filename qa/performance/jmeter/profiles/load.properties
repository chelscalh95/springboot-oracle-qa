# LOAD: a modest concurrent mix for a fixed time. The numbers are illustrative starting points chosen for
# a demo application on one machine; they are NOT derived from any requirement or expected traffic.
host=localhost
port=8080
readThreads=10
writeThreads=3
negativeThreads=1
rampUp=15
# -1 = repeat until the duration (seconds) has elapsed
loops=-1
duration=120
thinkBaseMs=200
thinkRangeMs=300
# PLACEHOLDER threshold, not a requirement: no SLA exists for this application.
maxResponseMs=2000
